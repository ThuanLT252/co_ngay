<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Firebase App & Realtime Database Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <title>Cờ Chiến Thuật 24 - Professional 2D</title>
    <style>
      :root {
        --bg-grad: radial-gradient(circle, #2c3e50 0%, #000000 100%);
        --panel-bg: rgba(44, 62, 80, 0.9);
        --highlight: #f1c40f;
        --text-color: #ecf0f1;
        --red-piece: #ff7675;
        --blue-piece: #74b9ff;
      }

      body {
        background: var(--bg-grad);
        color: var(--text-color);
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      h1 {
        margin-bottom: 30px;
        color: var(--highlight);
        text-transform: uppercase;
        letter-spacing: 5px;
        text-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
      }

      .game-wrapper {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        gap: 30px;
        width: 100%;
        max-width: 1300px;
      }

      .side-column {
        flex: 1;
        min-width: 280px;
        max-width: 320px;
        background: var(--panel-bg);
        padding: 25px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .center-column {
        flex: 0 0 auto;
        position: relative;
      }

      canvas {
        background: #ecf0f1;
        cursor: pointer;
        border-radius: 10px;
        border: 8px solid #34495e;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
      }

      #status {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 5px;
        color: var(--highlight);
      }
      #sub-status {
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 20px;
        transition: color 0.3s;
      }

      #resetBtn {
        width: 100%;
        background: #27ae60;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }
      #resetBtn:hover {
        background: #2ecc71;
      }

      .instructions h3 {
        margin-top: 0;
        color: var(--highlight);
        border-bottom: 1px solid #555;
        padding-bottom: 10px;
      }
      .instructions ul {
        padding-left: 15px;
        font-size: 0.95rem;
        list-style: none;
      }
      .instructions li {
        margin-bottom: 12px;
        border-left: 3px solid var(--highlight);
        padding-left: 10px;
        line-height: 1.4;
      }

      @media (max-width: 1100px) {
        .game-wrapper {
          flex-direction: column;
          align-items: center;
        }
        .side-column {
          width: 100%;
          max-width: 600px;
        }
      }
    </style>
  </head>
  <body>
    <h1>CỜ CHIẾN THUẬT 24</h1>

    <div class="game-wrapper">
      <div class="side-column">
        <div class="status-box">
          <div id="status">Sẵn sàng</div>
          <div id="sub-status">Lượt người chơi 1</div>
          <button id="resetBtn">CHƠI VÁN MỚI</button>
        </div>
      </div>

      <div class="center-column">
        <canvas id="gameBoard" width="600" height="600"></canvas>
      </div>

      <div class="side-column instructions">
        <h3>LUẬT CHƠI</h3>
        <ul>
          <li>
            📍 <b>Hiệp 1:</b> Đặt 24 quân. Tạo hàng 3 để Khóa Mục Tiêu quân
            địch.
          </li>
          <li>🚫 <b>Lưu ý:</b> Quân bị khóa không thể tạo hàng 3 mới.</li>
          <li>
            🏃 <b>Hiệp 2:</b> Di chuyển quân để tạo hàng 3 và xóa trực tiếp quân
            địch.
          </li>
          <li>🏆 <b>Thắng:</b> Đối thủ còn < 3 quân hoặc bị vây chặt.</li>
        </ul>
      </div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDDZ5E2THCJBS8FpMDts2Z4vKBHt7EnxJ8",
        authDomain: "congay.firebaseapp.com",
        databaseURL:
          "https://congay-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "congay",
        storageBucket: "congay.firebasestorage.app",
        messagingSenderId: "626260272788",
        appId: "1:626260272788:web:79990e1c768041024fb681",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const gameRef = db.ref("games/phong_chung_01");
      let myRole = null;

      const presenceRef = db.ref("games/phong_chung_01/players");
      presenceRef.transaction((currentPlayers) => {
        if (!currentPlayers) {
          myRole = 1;
          return { p1: true, p2: false };
        } else if (!currentPlayers.p1) {
          myRole = 1;
          return { ...currentPlayers, p1: true };
        } else if (!currentPlayers.p2) {
          myRole = 2;
          return { ...currentPlayers, p2: true };
        }
        myRole = 3;
        return currentPlayers;
      });

      const canvas = document.getElementById("gameBoard");
      const ctx = canvas.getContext("2d");
      const statusText = document.getElementById("status");
      const subStatusText = document.getElementById("sub-status");
      const resetBtn = document.getElementById("resetBtn");

      const size = 600,
        padding = 60,
        cellSize = (size - padding * 2) / 6;
      let currentPlayer,
        phase,
        placingCount,
        selectedPiece,
        isRemovingMode,
        gameActive,
        boardState;
      let activeMill = null;
      let globalAnimFrame = null;
      let animStep = 0;

      const points = [
        { x: 0, y: 0 },
        { x: 3, y: 0 },
        { x: 6, y: 0 },
        { x: 6, y: 3 },
        { x: 6, y: 6 },
        { x: 3, y: 6 },
        { x: 0, y: 6 },
        { x: 0, y: 3 },
        { x: 1, y: 1 },
        { x: 3, y: 1 },
        { x: 5, y: 1 },
        { x: 5, y: 3 },
        { x: 5, y: 5 },
        { x: 3, y: 5 },
        { x: 1, y: 5 },
        { x: 1, y: 3 },
        { x: 2, y: 2 },
        { x: 3, y: 2 },
        { x: 4, y: 2 },
        { x: 4, y: 3 },
        { x: 4, y: 4 },
        { x: 3, y: 4 },
        { x: 2, y: 4 },
        { x: 2, y: 3 },
      ];

      const mills = [
        [0, 1, 2],
        [2, 3, 4],
        [4, 5, 6],
        [6, 7, 0],
        [8, 9, 10],
        [10, 11, 12],
        [12, 13, 14],
        [14, 15, 8],
        [16, 17, 18],
        [18, 19, 20],
        [20, 21, 22],
        [22, 23, 16],
        [1, 9, 17],
        [5, 13, 21],
        [7, 15, 23],
        [3, 11, 19],
        [0, 8, 16],
        [2, 10, 18],
        [4, 12, 20],
        [6, 14, 22],
      ];

      const adj = Array.from({ length: 24 }, () => []);
      mills.forEach((mill) => {
        for (let i = 0; i < mill.length - 1; i++) {
          const u = mill[i],
            v = mill[i + 1];
          if (!adj[u].includes(v)) adj[u].push(v);
          if (!adj[v].includes(u)) adj[v].push(u);
        }
      });

      gameRef.on("value", (snapshot) => {
        const gameState = snapshot.val();
        if (!gameState || !gameState.boardState) {
          if (myRole === 1) resetGameOnCloud();
          return;
        }

        currentPlayer = gameState.currentPlayer;
        phase = gameState.phase;
        placingCount = gameState.placingCount;
        boardState = gameState.boardState;
        gameActive = gameState.gameActive;
        isRemovingMode = gameState.isRemovingMode;
        activeMill = gameState.activeMill || null;

        manageLoopAnimation();
        updateUIState();
      });

      function syncToCloud() {
        gameRef.update({
          currentPlayer: currentPlayer,
          phase: phase,
          placingCount: placingCount,
          boardState: boardState,
          gameActive: gameActive,
          isRemovingMode: isRemovingMode,
          activeMill: activeMill,
        });
      }

      function resetGameOnCloud() {
        const initialBoard = points.map(() => ({ player: 0, tagged: false }));
        gameRef.set({
          currentPlayer: 2,
          phase: 1,
          placingCount: 0,
          boardState: initialBoard,
          gameActive: true,
          isRemovingMode: false,
          activeMill: null,
        });
      }

      function getPixel(idx) {
        return {
          x: padding + points[idx].x * cellSize,
          y: padding + points[idx].y * cellSize,
        };
      }

      function manageLoopAnimation() {
        if (globalAnimFrame) cancelAnimationFrame(globalAnimFrame);

        function renderLoop() {
          animStep++;
          drawScene();
          if (activeMill || isRemovingMode) {
            globalAnimFrame = requestAnimationFrame(renderLoop);
          }
        }
        renderLoop();
      }

      function drawScene() {
        ctx.clearRect(0, 0, size, size);
        ctx.strokeStyle = "#34495e";
        ctx.lineWidth = 4;

        mills.forEach((m) => {
          ctx.beginPath();
          const p1 = getPixel(m[0]),
            p2 = getPixel(m[1]),
            p3 = getPixel(m[2]);
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineTo(p3.x, p3.y);
          ctx.stroke();
        });

        // Hiệu ứng đường thẳng hàng 3 chớp chậm
        if (activeMill) {
          const showLine = Math.floor(animStep / 30) % 2 === 0;
          if (showLine) {
            ctx.save();
            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 10;
            ctx.shadowColor = "#f1c40f";
            ctx.shadowBlur = 15;
            ctx.beginPath();
            const p1 = getPixel(activeMill[0]),
              p2 = getPixel(activeMill[1]),
              p3 = getPixel(activeMill[2]);
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.stroke();
            ctx.restore();
          }
        }

        const opponent = currentPlayer === 1 ? 2 : 1;

        boardState.forEach((state, i) => {
          const p = getPixel(i);
          ctx.beginPath();
          ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = "#bdc3c7";
          ctx.fill();

          if (state.player !== 0) {
            ctx.beginPath();
            ctx.arc(p.x + 2, p.y + 3, 22, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.fill();

            const grad = ctx.createRadialGradient(
              p.x - 6,
              p.y - 6,
              2,
              p.x,
              p.y,
              22,
            );
            if (state.player === 1) {
              grad.addColorStop(0, "#ff7675");
              grad.addColorStop(1, "#d63031");
            } else {
              grad.addColorStop(0, "#74b9ff");
              grad.addColorStop(1, "#0984e3");
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // Hiệu ứng tỏa sáng liên tục cho quân địch cần chọn
            if (isRemovingMode && state.player === opponent && !state.tagged) {
              const pulse = Math.sin(animStep * 0.1) * 6 + 24;
              const alpha = ((Math.sin(animStep * 0.1) + 1) / 2) * 0.7 + 0.3;

              ctx.save();
              ctx.beginPath();
              ctx.arc(p.x, p.y, pulse, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(255, 234, 167, ${alpha})`;
              ctx.lineWidth = 6;
              ctx.shadowColor = "#ffeaa7";
              ctx.shadowBlur = 12;
              ctx.stroke();
              ctx.restore();
            }

            // Hiệu ứng Khóa Mục Tiêu (Target Lock) thay cho chữ X cũ
            if (state.tagged) {
              ctx.save();
              ctx.strokeStyle = "#e74c3c";
              ctx.lineWidth = 3;
              ctx.setLineDash([4, 4]);
              ctx.beginPath();
              ctx.arc(p.x, p.y, 24, 0, Math.PI * 2);
              ctx.stroke();

              ctx.strokeStyle = "#e74c3c";
              ctx.lineWidth = 2;
              ctx.setLineDash([]);
              ctx.beginPath();
              ctx.moveTo(p.x - 8, p.y);
              ctx.lineTo(p.x + 8, p.y);
              ctx.moveTo(p.x, p.y - 8);
              ctx.lineTo(p.x, p.y + 8);
              ctx.stroke();
              ctx.restore();
            }

            if (selectedPiece === i) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
              ctx.strokeStyle = "#f1c40f";
              ctx.lineWidth = 4;
              ctx.stroke();
            }
          }
        });
      }

      function checkMillAndGetIndices(idx, player) {
        const found = mills.find(
          (mill) =>
            mill.includes(idx) &&
            mill.every(
              (i) => boardState[i].player === player && !boardState[i].tagged,
            ),
        );
        return found || null;
      }

      function canMove(player) {
        const playerPos = boardState
          .map((s, i) => (s.player === player ? i : -1))
          .filter((i) => i !== -1);
        return playerPos.some((pos) =>
          adj[pos].some((n) => boardState[n].player === 0),
        );
      }

      canvas.addEventListener("mousedown", (e) => {
        if (!gameActive) return;
        if (currentPlayer !== myRole) {
          alert("Chưa đến lượt của bạn!");
          return;
        }
        if (activeMill) return;

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const clickedIdx = points.findIndex(
          (p, i) => Math.hypot(getPixel(i).x - x, getPixel(i).y - y) < 30,
        );
        if (clickedIdx === -1) return;

        if (isRemovingMode) handleRemoving(clickedIdx);
        else if (phase === 1) handlePhase1(clickedIdx);
        else handlePhase2(clickedIdx);
      });

      function handlePhase1(idx) {
        if (boardState[idx].player !== 0) return;
        boardState[idx].player = currentPlayer;
        placingCount++;

        const mill = checkMillAndGetIndices(idx, currentPlayer);
        if (mill) {
          activeMill = mill;
          isRemovingMode = true;
          statusText.innerText = "HÀNG 3!";
          subStatusText.innerText = `Người ${currentPlayer}: Đã khóa mục tiêu!`;

          setTimeout(() => {
            activeMill = null;
            syncToCloud();
          }, 2500);
        } else {
          nextTurn();
        }
        if (placingCount === 24 && !isRemovingMode) startPhase2();
        else syncToCloud();
      }

      function handlePhase2(idx) {
        const state = boardState[idx];
        if (selectedPiece === null) {
          if (state.player === currentPlayer) selectedPiece = idx;
          manageLoopAnimation();
        } else {
          if (state.player === 0 && adj[selectedPiece].includes(idx)) {
            boardState[idx].player = currentPlayer;
            boardState[selectedPiece].player = 0;

            const mill = checkMillAndGetIndices(idx, currentPlayer);
            if (mill) {
              activeMill = mill;
              isRemovingMode = true;
              statusText.innerText = "MILL!";
              subStatusText.innerText = `Người ${currentPlayer}: Tạo hàng 3 thành công!`;
              selectedPiece = null;

              setTimeout(() => {
                activeMill = null;
                syncToCloud();
              }, 2500);
            } else {
              selectedPiece = null;
              nextTurn();
            }
          } else {
            selectedPiece = state.player === currentPlayer ? idx : null;
          }
          manageLoopAnimation();
          syncToCloud();
        }
      }

      function handleRemoving(idx) {
        const opponent = currentPlayer === 1 ? 2 : 1;
        if (boardState[idx].player !== opponent || boardState[idx].tagged)
          return;

        if (phase === 1) boardState[idx].tagged = true;
        else boardState[idx] = { player: 0, tagged: false };

        isRemovingMode = false;
        activeMill = null;

        if (phase === 1 && placingCount === 24) startPhase2();
        else nextTurn();
        syncToCloud();
      }

      function startPhase2() {
        phase = 2;
        boardState = boardState.map((s) =>
          s.tagged ? { player: 0, tagged: false } : s,
        );
        statusText.innerText = "HIỆP 2 BẮT ĐẦU";
        nextTurn();
      }

      function nextTurn() {
        if (phase === 2) {
          const p1 = boardState.filter((s) => s.player === 1).length;
          const p2 = boardState.filter((s) => s.player === 2).length;
          if (p1 < 3) return endGame("XANH THẮNG!", "Đỏ đã hết quân.");
          if (p2 < 3) return endGame("ĐỎ THẮNG!", "Xanh đã hết quân.");
          const nextP = currentPlayer === 1 ? 2 : 1;
          if (!canMove(nextP))
            return endGame(
              `${currentPlayer === 1 ? "ĐỎ" : "XANH"} THẮNG!`,
              "Đối thủ bị vây chặt.",
            );
        }
        currentPlayer = currentPlayer === 1 ? 2 : 1;
      }

      function updateUIState() {
        const playerColor =
          currentPlayer === 1 ? "var(--red-piece)" : "var(--blue-piece)";
        subStatusText.style.color = playerColor;

        if (gameActive && !isRemovingMode && !activeMill) {
          statusText.innerText =
            phase === 1 ? "Hiệp 1: Đặt quân" : "Hiệp 2: Di chuyển";
          subStatusText.innerText = `Lượt: Người chơi ${currentPlayer} (${currentPlayer === 1 ? "Đỏ" : "Xanh"}) ${myRole === currentPlayer ? " (Lượt của bạn)" : ""}`;
        }
      }

      function endGame(title, detail) {
        gameActive = false;
        statusText.innerText = title;
        statusText.style.color = "#f1c40f";
        subStatusText.innerText = detail;
        subStatusText.style.color = "#ecf0f1";
      }

      resetBtn.addEventListener("click", () => {
        if (myRole === 1 || myRole === 2) {
          resetGameOnCloud();
        } else {
          alert("Chỉ người chơi chính mới có thể reset ván đấu!");
        }
      });
    </script>
  </body>
</html>
